<header><h1>暗门地牢</h1><div class="row"><span id="perspective"></span><button id="help" aria-label="帮助">ⓘ</button></div></header>
<main id="app"></main>
<dialog id="guide"><h3>怎么操作</h3><p>城主埋牌后，冒险者从亮起的房间选路，再选承担者。检定达到 DC 即成功。优势掷两颗取高，劣势取低。城主的候选牌只在城主视角显示。</p><form method="dialog"><button>关闭</button></form></dialog>
<script src="暗门地牢素材/遭遇与怪物.js?v=1d961c3083c3"></script>
<script src="暗门地牢素材/收获.js?v=1d961c3083c3"></script>
<script src="暗门地牢素材/地图.js?v=1d961c3083c3"></script>

<script>
const app=document.querySelector('#app'), perspective=document.querySelector('#perspective');
document.querySelector('#help').onclick=()=>document.querySelector('#guide').showModal();
const names=['阿栎','苔丝','灰羽'], colors=['#a55946','#476c88','#ba8a42'];
const cards=encounterTable.filter(card=>card.tier===1);
const upgradeEvents={2:encounterTable.filter(card=>card.tier===2),3:encounterTable.filter(card=>card.tier===3)};
let monster=null, guard=0, challenger=null, monsterDraw, monsterDiscard;
const items=dungeonRewards;
let difficulty='standard', tileSupply=[], protectedSoul=false, overflowZone='hand', overflowOwner=0;
function shufflePile(pile){for(let i=pile.length-1;i>0;i--){const j=Math.floor(coin()*(i+1));[pile[i],pile[j]]=[pile[j],pile[i]]}return pile}
const encounterText=c=>c.kind==='战斗'?'战斗失败：承担者失去 1 魂，城主获得 2 回响。'+c.text.replace('战斗。',''):c.text;
const roomText=room=>({宝藏:'成功翻两张收获选一；失败翻一张，只能收普通道具。',恢复:'成功时全队各恢复 1 魂。',奇遇:'翻一张收获；成功且翻到碎片才可领取，失败只能收普通道具。'})[room]??'没有额外房间奖励。';
const describe=c=>'<small>'+roman[c.tier]+' 级 · '+c.kind+' · '+c.attribute+' DC '+c.dc+' · 偏好 '+c.prefer+'</small><p>'+encounterText(c)+'</p>';
const rooms=[];
const directions=[[1,0,'east','→'],[0,1,'south','↓'],[-1,0,'west','←'],[0,-1,'north','↑']];
let visited=new Set([0]), opening=[], rerollOwner=null, rerollDie=null, rerollCard=null, rerollZone='hand', selectedCards=new Set(), rewards=[], rewardChoices=[], rewardSuccess=false;
const fragmentCard={name:'地牢碎片',fragment:true,text:'成功时领取，碎片进度 +1。'};
function roomAt(x,y){return rooms.findIndex(r=>r.x===x&&r.y===y)}
function linkRooms(a,b){rooms[a].links.push(b);rooms[b].links.push(a)}
function placements(source,d,preferred){
 const [dx,dy]=directions[d];
 const templates=[...tileSupply].sort((a,b)=>Number(b.name===preferred)-Number(a.name===preferred));
 return templates.map(tile=>({tile,cells:tile.cells.map(([f,t])=>[source.x+(f+1)*dx-t*dy,source.y+(f+1)*dy+t*dx])}));
}
function fit(source,d,preferred){return placements(source,d,preferred).find(p=>p.cells.every(([x,y])=>roomAt(x,y)===-1))}
function addRegion(id,door,preferred){
 const placement=fit(rooms[id],door.dir,preferred);
 if(!placement){door.state='dead';return false}
 const {cells,tile}=placement, first=rooms.length;
 tileSupply.splice(tileSupply.indexOf(tile),1);
 cells.forEach(([x,y],i)=>rooms.push({x,y,name:tile.rooms[i],shape:tile.name,tile,links:[],exits:[]}));
 linkRooms(id,first);
 for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
  if(Math.abs(cells[i][0]-cells[j][0])+Math.abs(cells[i][1]-cells[j][1])===1)linkRooms(first+i,first+j);
 }
 for(const [i,dir] of tile.doors)rooms[first+i].exits.push({dir:(dir+door.dir)%4,state:'open'});
 door.state='linked';return true;
}
function resetMap(){
 tileSupply=[...dungeonTiles];
 rooms.splice(0);
 rooms.push({x:0,y:0,name:'入口',links:[],exits:[]});
 directions.forEach((_,dir)=>addRegion(0,{dir},['直线','方形','山形','闪电'][dir]));
 visited=new Set([0]);
}
function routes(){
 const connected=new Set([at]), queue=[at], reachable=new Set();
 for(const i of queue)for(const j of rooms[i].links){
  if(!visited.has(j))reachable.add(j);
  else if(!connected.has(j)){connected.add(j);queue.push(j)}
 }
 return [...reachable];
}
function expandMap(){
 for(const i of visited)for(const door of rooms[i].exits.filter(exit=>exit.state==='open')){
  note(addRegion(i,door)?'打开'+rooms[i].name+'房外门 '+directions[door.dir][3]+'，接上一块新区域。':'外门 '+directions[door.dir][3]+' 无法拼接，标为死路。');
 }
 for(const room of rooms)for(const door of room.exits.filter(exit=>exit.state==='open')){
  if(!fit(room,door.dir)){
   door.state='dead';note(room.name+'房外门 '+directions[door.dir][3]+' 无法拼接，标为死路。');
  }
 }
}
function roomDoors(room){
 return directions.map(([dx,dy,edge,arrow],dir)=>{
  const exit=room.exits.find(d=>d.dir===dir&&d.state!=='linked');
  if(room.links.includes(roomAt(room.x+dx,room.y+dy)))return '<span class="door '+edge+'"></span>';
  return exit?'<span class="door '+edge+' external '+exit.state+'"></span><small class="external-label '+exit.state+'">'+arrow+' '+(exit.state==='dead'?'死路':'外门')+'</small>':'';
 }).join('');
}

let cityHand=[], cityPicks=new Set(), cityAction='', maze=1, broadcast=[], afterBroadcast=null;
const upgradeCosts=[3,7,12], roman=['','I','II','III','IV'];
function announce(messages,next){broadcast=messages;afterBroadcast=next;phase='broadcast';render()}
function nextAnnouncement(){
 broadcast.shift();
 if(broadcast.length){render();return}
 const next=afterBroadcast;afterBroadcast=null;next();
}
let side='party', roles=['体魄','心智','魅力'], phase='setup', heroes=[], at=0, selected=null, bearer=0, turn=0, round=1, echo=0, fragments=0, deck=[], discards=[], discardHistory=[], kept=null, offer=[], dice=[], mode=0, log=[], result='', chooseDie=false, discardOpen=false;
const coin=()=>Math.random(), die=()=>Math.floor(coin()*20)+1;
const button=(label,action,style='',disabled=false)=>'<button data-action="'+action+'" class="'+style+'" '+(disabled?'disabled':'')+'>'+label+'</button>';
const alive=()=>heroes.map((h,i)=>h.soul>0?i:-1).filter(i=>i>=0);
const note=(text,room=round)=>log.push({room,text});
function discard(card){discards.push(card);discardHistory.push({card,room:round})}
function draw(){if(!deck.length){deck=[...discards];discards=[];note('遭遇牌堆已回洗。公开弃牌记录继续保留。')}return deck.splice(Math.floor(coin()*deck.length),1)[0]}
function start(){
 const ordinary=shufflePile(items.filter(card=>card.tier===1));
 const starting=ordinary.filter(card=>!card.equipment);
 heroes=roles.map(role=>({role,soul:role==='体魄'?4:3,max:role==='体魄'?4:3,equipment:[],hand:role==='心智'?[starting.shift()]:[],limit:role==='心智'?3:2}));
 resetMap();opening=[];rerollOwner=null;selectedCards.clear();rewardChoices=[];afterReward=null;payment=null;roomIncome=0;rewards=shufflePile([...Array(4).fill(fragmentCard),...ordinary.filter(card=>!heroes.some(hero=>hero.hand.includes(card)))]);
 at=0;selected=null;turn=0;round=1;echo=0;fragments=0;deck=[...cards];monsterDraw={1:[...monsters[1]],2:[],3:[]};monsterDiscard={1:[],2:[],3:[]};discards=[];cityHand=[];cityPicks.clear();maze=1;broadcast=[];discardHistory=[];discardOpen=false;kept=null;offer=[];log=[];note('每名心智随机获得 1 张普通物品。',0);beginRoom();
}
function beginRoom(){
 expandMap();
 cityHand=Array.from({length:6},draw);
 note('城主摸牌 6 张。');
 announce(['城主摸牌 6 张。'],()=>prepareDeployment('opening'));
}
function prepareDeployment(action='single'){
 if(side==='city'){cityAction=action;cityPicks.clear();phase='deploy';render();return}
 if(action==='opening'){commitDeployment('opening',[0,1,2]);return}
 const options=routes(), preferred=options.map(id=>rooms[id].name);
 const ranked=dungeonDecision.rankHand(cityHand,preferred,difficulty);
 const cost=upgradeCosts[maze-1];
 const extra=echo>0&&ranked.length>=2&&opening.length<2&&echo+1<cost;
 const actionChoice=ranked.length>=3&&(cityHand.length>6||opening.length<2)?'handExtra':extra?'extra':ranked.length>=2&&opening.some(card=>!preferred.includes(card.prefer))?'filter':'single';
 commitDeployment(actionChoice,ranked.slice(0,actionChoice==='single'?1:actionChoice==='handExtra'?3:2));
}
function commitDeployment(action,indices){
 const needed=action==='opening'?3:action==='single'?1:action==='handExtra'?3:2;
 if(indices.length!==needed||new Set(indices).size!==needed||indices.some(i=>!cityHand[i])||(action==='extra'&&echo<1))return;
 const paid=action==='handExtra'?cityHand[indices[2]]:null;
 const chosen=indices.slice(0,action==='handExtra'?2:needed).map(i=>cityHand[i]);
 for(const index of [...indices].sort((a,b)=>b-a))cityHand.splice(index,1);
 opening.push(...chosen);
 if(paid)discard(paid);
 if(action==='filter'){
  note('城主从手牌埋下 2 张，随后从整个埋牌区挑 1 张弃置。');
  if(side==='city'){phase='prune';render();return}
  const routeTypes=routes().map(id=>rooms[id].name);
  const index=opening.findIndex(card=>!routeTypes.includes(card.prefer));
  pruneBuried(index<0?0:index);return;
 }
 if(action==='extra')echo--;
 const text=paid?'城主公开弃置手牌「'+paid.name+'」，额外埋下 1 张，本次共埋下 2 张。':action==='extra'?'城主花费 1 点回响，额外埋下 1 张，本次共埋下 2 张。':'城主埋下 '+chosen.length+' 张。';
 deploymentDone(text);
}
function pruneBuried(index){
 const [removed]=opening.splice(index,1);discard(removed);
 deploymentDone('城主埋下 2 张，再从整个埋牌区公开弃置「'+removed.name+'」。');
}
function enforceCityLimit(){
 if(cityHand.length<=6){phase='route';selected=null;bearer=alive()[0];render();return}
 if(side==='city'){phase='cityOverflow';render();return}
 const ranked=dungeonDecision.rankHand(cityHand,routes().map(id=>rooms[id].name),difficulty);
 discardCityHand(ranked[ranked.length-1]);
}
function discardCityHand(index){
 const [card]=cityHand.splice(index,1);if(!card)return;discard(card);
 const text='城主手牌超过 6 张，公开弃置「'+card.name+'」。';note(text);announce([text],enforceCityLimit);
}
function deploymentDone(text){
 note(text+' 手牌剩 '+cityHand.length+' 张，埋牌区现有 '+opening.length+' 张。');
 announce([text,'城主手牌剩 '+cityHand.length+' 张。埋牌区现有 '+opening.length+' 张。'],()=>{
  enforceCityLimit();
 });
}
function startCityTurn(){
 round++;expandMap();
 if(!routes().length){result='地图已无可探索房间，本局原型停止。';note(result);phase='end';render();return}
 let count=0;for(let i=0;i<maze;i++){const card=draw();if(card){cityHand.push(card);count++}}
 const text='城主按 '+roman[maze]+' 级摸牌 '+count+' 张（应摸 '+maze+' 张）。';
 note(text);
 announce([text],()=>{
  if(echo>=upgradeCosts[maze-1]){
   if(side==='city'){phase='upgrade';render()}else upgradeMaze();
  }else prepareDeployment();
 });
}
function movableTiles(){
 return [...new Set(rooms.map(room=>room.tile).filter(Boolean))].filter(tile=>{
  const ids=rooms.flatMap((room,i)=>room.tile===tile?[i]:[]);
  return ids.every(i=>!visited.has(i))&&ids.flatMap(i=>rooms[i].links.filter(j=>!ids.includes(j))).length===1;
 });
}
let movingTile=null;
function moveOptions(tile){
 const ids=rooms.flatMap((room,i)=>room.tile===tile?[i]:[]);
 const occupied=(x,y)=>{const i=roomAt(x,y);return i!==-1&&!ids.includes(i)};
 return rooms.flatMap((room,i)=>ids.includes(i)?[]:room.exits.flatMap(door=>{
  if(door.state==='linked')return [];
  const [dx,dy]=directions[door.dir];
  const cells=tile.cells.map(([f,t])=>[room.x+(f+1)*dx-t*dy,room.y+(f+1)*dy+t*dx]);
  return cells.some(([x,y])=>occupied(x,y))?[]:[{i,door,cells}];
 }));
}
function relocate(index){
 const {i,door,cells}=moveOptions(movingTile)[index];
 const ids=rooms.flatMap((room,j)=>room.tile===movingTile?[j]:[]);
 const entry=ids[0], old=rooms[entry].links.find(j=>!ids.includes(j));
 if(old===undefined)return;
 const oldRoom=rooms[old], first=rooms[entry];
 const dir=directions.findIndex(([x,y])=>oldRoom.x+x===first.x&&oldRoom.y+y===first.y);
 oldRoom.links=oldRoom.links.filter(j=>j!==entry);
 first.links=first.links.filter(j=>j!==old);
 const previous=oldRoom.exits.find(exit=>exit.dir===dir);
 if(previous)previous.state='open';else oldRoom.exits.push({dir,state:'open'});
 for(const [k,id] of ids.entries()){
  const room=rooms[id];[room.x,room.y]=cells[k];room.exits=[];
 }
 for(const [k,d] of movingTile.doors)rooms[ids[k]].exits.push({dir:(d+door.dir)%4,state:'open'});
 door.state='linked';linkRooms(i,entry);note('城主免费改图：移动「'+movingTile.name+'」板块。');
 movingTile=null;prepareDeployment();
}
function offerMapChange(){
 movingTile=null;
 if(side==='city'&&movableTiles().some(tile=>moveOptions(tile).length)){phase='mapChange';render();return}
 note('本次升级未改图。');prepareDeployment();
}
function upgradeMaze(){
 const cost=upgradeCosts[maze-1];echo-=cost;maze++;
 const text='城主花费 '+cost+' 点回响，迷宫升级为 '+roman[maze]+' 级。';
 note(text);
 if(maze===4){announce([text],()=>{phase='end';render()});return}
 const events=upgradeEvents[maze], newRewards=items.filter(card=>card.tier===maze);
 newRewards.push(...Array(2).fill(fragmentCard));
 deck.push(...events);rewards.push(...newRewards);monsterDraw[maze]=[...monsters[maze]];
 for(const pile of [deck,rewards])for(let i=pile.length-1;i>0;i--){const j=Math.floor(coin()*(i+1));[pile[i],pile[j]]=[pile[j],pile[i]]}
 const added='遭遇库加入「'+events.map(card=>card.name).join('」「')+'」。收获库加入「'+newRewards.filter(card=>!card.fragment).map(card=>card.name).join('」「')+'」及 2 枚碎片。';
 const unlocked='解锁 '+roman[maze]+' 级怪物与素材：'+monsters[maze].map(m=>m.name+'／'+m.loot.name).join('、')+'。';
 const bonus=draw();if(bonus)cityHand.push(bonus);
 const bonusText=bonus?'升级当回合额外补摸 1 张。':'牌堆无可用牌，升级补摸 0 张。';
 note(bonusText);note(added);note(unlocked);note('洗混遭遇牌库与收获牌库。');
 announce([text,added,unlocked,bonusText,'洗混遭遇牌库与收获牌库。盖着的埋牌和城主手牌留在原处。'],offerMapChange);
}

function reveal(){
 at=selected;visited.add(at);payment=null;tradeGoods=[];afterReward=null;roomIncome=0;roomFragment=false;dice=[];chooseDie=false;rerollOwner=null;rerollDie=null;selectedCards.clear();
 if(opening.length){
  const index=Math.floor(coin()*opening.length);
  kept=opening.splice(index,1)[0];
  note('随机揭晓 1 张，其余 '+opening.length+' 张继续盖在埋牌区。');
 }

 '<div class="row action">'+(route?(selected===null?'绿色房间可探索 · 灰色房间自动穿过':alive().map(i=>button(names[i], 'hero'+i,bearer===i?'primary':'')).join('')+button('确认进房','reveal','primary')):phase==='route'?button('让冒险者行动','aiRoute','primary'):phase==='clear'?result+button('查看城主行动','next','primary'):phase==='end'?(fragments>=4?'冒险者获胜':maze===4||!alive().length?'城主获胜':result):'')+'</div>'+
 (showCheck?'<section class="paper check"><h3>'+kept.name+'</h3><span class="pref '+(kept.prefer===rooms[at].name?'match':'')+'" data-type="'+kept.prefer+'">城主偏好 · '+kept.prefer+'房'+(kept.prefer===rooms[at].name?' · 已命中':'')+'</span><div class="effect">'+describe(kept)+''+(monster?'<article class="effect"><h3>怪物 · '+monster.name+'</h3><p>'+monster.ability+'</p><strong>掉落 · '+monster.loot.name+'（'+(monster.loot.equipment?'装备':'物品')+'）</strong><p>'+monster.loot.timing+' · '+monster.loot.text+'</p></article>':'')+'<p>'+rooms[at].name+'房：'+roomText(rooms[at].name)+'</p><small>净劣势给城主 1 回响；若战斗失败已给 2 回响，则不叠加。</small></div><h2>'+kept.attribute+'检定 · DC '+kept.dc+'</h2><p>'+names[bearer]+'承担 · '+(shownMode>0?'优势，取高':shownMode<0?'劣势，取低':'普通')+'</p>'+(queued.length?'<p class="queued">待使用：'+queued.join('、')+' · 掷骰时确认</p>':'')+(chooseDie?'<p class="queued">待使用：'+names[rerollOwner]+' · '+heroes[rerollOwner][rerollZone][rerollCard].name+(rerollDie===null?' · 请选择骰子':' · 重掷骰 '+(rerollDie+1))+'</p>':'')+'<div class="dice">'+(dice.length?dice:Array(shownMode?2:1).fill('D20')).map((d,i)=>chooseDie?button('选骰 '+(i+1)+'（'+d+'）','die'+i,rerollDie===i?'primary':''):'<span class="die '+(d===final?'used':'')+'">'+d+'</span>').join('')+'</div><div class="row action">'+(phase==='check'?(side==='party'?'<small>存活队友都可在下方出牌支援承担者。</small>'+button('掷骰','roll','primary'):button('让冒险者检定','aiRoll','primary')):(chooseDie?button('确认重掷','confirmDie','primary',rerollDie===null)+button('取消重掷','cancelDie'):button('结算','finish','primary')))+'</div></section>':'')+rewardUI+cityPanel+mapPanel+'</section>'+
 '<section class="heroes">'+heroes.map((h,i)=>'<div class="paper"><h3>'+names[i]+' · '+h.role+'</h3><p>魂 '+h.soul+' / '+h.max+'</p><span class="slots">装备 '+h.equipment.length+' / 2</span> <span class="slots">手牌 '+h.hand.length+' / '+h.limit+'</span>'+handCards(h,i)+'</div>').join('')+'</section>'+
 '<div class="row spread" style="margin-top:12px"><small>原型 · 简化结算</small><div class="row">'+button('导出记录','export')+button('返回设置','setup')+'</div></div></div>'+journal()+'</div>';
 const details=document.querySelector('#discard-details');
 details.ontoggle=()=>{discardOpen=details.open};
}
app.onchange=e=>{if(e.target.id==='difficulty')difficulty=e.target.value;if(e.target.matches('[data-hero]'))roles[Number(e.target.dataset.hero)]=e.target.value};
app.onclick=e=>{
 const action=e.target.closest('button')?.dataset.action;if(!action)return;
 if(action==='city'||action==='party'){side=action;if(side==='city')roles=['体魄','心智','魅力']}
 else if(action==='start'){start();return}
 else if(action==='rotate')turn=(turn+15)%360;
 else if(action==='reset')turn=0;
 else if(action.startsWith('moveTile'))movingTile=movableTiles()[Number(action.slice(8))];
 else if(action.startsWith('moveTo')){relocate(Number(action.slice(6)));return}
 else if(action==='skipMap'){note('城主跳过免费改图。');prepareDeployment();return}
 else if(action.startsWith('cityDrop')){discardCityHand(Number(action.slice(8)));return}
 else if(action==='refuseTrade'){startTrade(-1);return}
 else if(action.startsWith('pay')){startTrade(Number(action.slice(3)));return}
 else if(action.startsWith('prune')){pruneBuried(Number(action.slice(5)));return}
 else if(action==='compareReveal'){compareReveal();return}
 else if(action.startsWith('revealCard')){if(phase==='compare')chooseEncounter(Number(action.slice(10)));else showEncounter();return}
 else if(action==='advance'){nextAnnouncement();return}
 else if(action==='upgrade'){upgradeMaze();return}
 else if(action==='skipUpgrade'){note('城主本房不升级。');prepareDeployment();return}
 else if(action.startsWith('action')){
  cityAction={actionSingle:'single',actionFilter:'filter',actionExtra:'extra',actionHandExtra:'handExtra'}[action];cityPicks.clear();
 }
 else if(action.startsWith('pickCity')){
  const i=Number(action.slice(8)), limit=cityAction==='opening'?3:cityAction==='single'?1:cityAction==='handExtra'?3:2;
  if(cityPicks.has(i))cityPicks.delete(i);else if(cityPicks.size<limit)cityPicks.add(i);
 }
 else if(action==='commitCity'){commitDeployment(cityAction,[...cityPicks]);return}
 else if(/^r\d+$/.test(action))selected=Number(action.slice(1));
 else if(action.startsWith('hero'))bearer=Number(action.slice(4));
 else if(action==='aiRoute'){const decision=dungeonDecision.route(routes(),rooms,heroes,alive(),difficulty);selected=decision.room;bearer=decision.bearer;reveal();return}
 else if(action==='reveal'){reveal();return}
 else if(action.startsWith('use')){
  const key=action.slice(3), [owner,index,zone]=key.split('-');
  if(heroes[owner][zone][index].effect==='peek'){
   const [item]=heroes[owner][zone].splice(index,1);
   note(names[owner]+'使用「'+item.name+'」，查看堆顶「'+rewards[0].name+'」。');
  }else if(heroes[owner][zone][index].timing==='掷前'){
   if(selectedCards.has(key))selectedCards.delete(key);else selectedCards.add(key);
  }else{
   chooseDie=!chooseDie;rerollOwner=Number(owner);rerollCard=Number(index);rerollZone=zone;rerollDie=null;
  }
 }
 else if(action==='cancelDie'){chooseDie=false;rerollDie=null}
 else if(action.startsWith('die')){const i=Number(action.slice(3));rerollDie=rerollDie===i?null:i}
 else if(action==='confirmDie'){
  const i=rerollDie,old=dice[i],hand=heroes[rerollOwner][rerollZone];
  const [item]=hand.splice(rerollCard,1);dice[i]=({twenty:()=>20,plus1:()=>Math.min(20,old+1),plus2:()=>Math.min(20,old+2),floor10:()=>Math.max(10,old)})[item.effect]?.()??die();chooseDie=false;rerollDie=null;
  note(names[rerollOwner]+'对'+names[bearer]+'使用「'+item.name+'」，骰 '+(i+1)+'：'+old+' → '+dice[i]+'。');
 }
 else if(action.startsWith('take')){takeReward(Number(action.slice(4)));return}
 else if(action==='skipReward'){takeReward(-1);return}
 else if(action.startsWith('drop')){dropReward(Number(action.slice(4)));return}
 else if(action==='roll'||action==='aiRoll'){roll();return}
 else if(action==='finish'){finish();return}
 else if(action==='next'){startCityTurn();return}
 else if(action==='setup')phase='setup';
 else if(action==='export'){
 const url=URL.createObjectURL(new Blob(['# 暗门地牢 · 原型记录\n\n'+log.map(x=>'- '+(x.room?'第 '+x.room+' 房':'开局')+' · '+x.text).join('\n')],{type:'text/markdown;charset=utf-8'}));
 const link=document.createElement('a');link.href=url;link.download='暗门地牢_试玩记录.md';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }
 render();
};
render();
// Dedicated screenshot states use the same screens and render path as play.
const preview=new URLSearchParams(location.search).get('preview');
if(preview==='city'){side='city';start();nextAnnouncement()}
if(preview==='check'){start();while(phase==='broadcast')nextAnnouncement();selected=1;bearer=1;reveal()}
</script>
</html>
